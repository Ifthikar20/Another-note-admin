# The checks every change must pass before it is merged. Make each job below a required
# status check in the branch protection rule for main (docs/SOC2.md, change management).
#
# On a push to main, once every check has passed, the release job builds the image again,
# scans it, and pushes it to ECR tagged with the commit's SHA. That tag is what
# deploy/deploy-aws.sh deploys. The release job needs three repository variables
# (Settings > Secrets and variables > Actions > Variables), and is skipped until they exist:
#   AWS_ROLE_TO_ASSUME  the role GitHub assumes through OIDC (docs/DEPLOY.md, step 3)
#   AWS_REGION          e.g. us-east-1
#   ECR_REPOSITORY      e.g. anothernote-admin
# No secret is stored in GitHub for any of this.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Scanners run from pinned images (Google's mirror of Docker Hub, which rate-limits less).
  TRIVY_IMAGE: mirror.gcr.io/aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  GITLEAKS_IMAGE: mirror.gcr.io/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  python:
    name: BFF (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the image runs; 3.11 is the version of build specification 6.1.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            bff/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - name: Known vulnerabilities in the BFF's dependencies
        if: matrix.python == '3.13'
        run: pip-audit --strict --no-deps -r bff/requirements.txt

  web:
    name: Web app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No inline script in the build (the Content-Security-Policy allows none)
        run: |
          if grep -Eq '<script(\s[^>]*)?>[^<]' dist/index.html; then
            echo "dist/index.html has an inline script"; exit 1
          fi
      - name: Known vulnerabilities in what ships (high and critical fail)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bff/requirements.txt
      - run: python -m pip install -r bff/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: The production build, served by the BFF, in front of the stand-in admin API
        working-directory: web
        env:
          PYTHON: python
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  image:
    name: Image (build, scan, SBOM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build
        run: docker build --tag anothernote-admin:ci --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Known vulnerabilities in the image (fixable high and critical fail)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy
          "$TRIVY_IMAGE" image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          anothernote-admin:ci
      - name: Software bill of materials (SPDX)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy
          -v "$PWD:/out" "$TRIVY_IMAGE" image --quiet --format spdx-json --output /out/sbom.spdx.json
          anothernote-admin:ci
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No secret anywhere in the history (known test values are in .gitleaksignore)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --redact --no-banner

  release:
    name: Release to ECR
    needs: [python, web, e2e, image, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_TO_ASSUME != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, scan and push the image, tagged with this commit
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build --tag "$IMAGE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
          docker push "$IMAGE"
          {
            echo "### Released \`${GITHUB_SHA:0:12}\`"
            echo "Image: \`$IMAGE\`"
            echo
            echo "Deploy it: \`./deploy/deploy-aws.sh $GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
